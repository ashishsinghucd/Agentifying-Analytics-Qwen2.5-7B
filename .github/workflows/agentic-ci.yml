name: agentic-ci

on:
  push:
    branches: [main]
    paths: ["agentic/**", "tests/**", "evaluations/**", "requirements-agentic.txt", ".github/workflows/agentic-ci.yml"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      VLM_BACKEND: mock          # no GPU in CI; the real ChartQA model is exercised in the GPU eval job
      AGENT_RUNS_DIR: outputs/agent_runs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-agentic.txt
      - run: pip install -r requirements-agentic.txt
      - name: Lint
        run: ruff check .
      - name: Unit + end-to-end tests
        run: pytest -q
      - name: Build synthetic warehouse
        run: python -m agentic.data.generate_synthetic
      - name: Golden-set evaluation (quality gate)
        run: python evaluations/eval_agent.py --min-accuracy 0.9 --out outputs/agent_eval.json
      - name: Export Power BI measures
        run: python -m agentic.cli export-dax > outputs/measures.dax
      - uses: actions/upload-artifact@v4
        with:
          name: agent-eval-${{ matrix.python-version }}
          path: |
            outputs/agent_eval.json
            outputs/measures.dax
